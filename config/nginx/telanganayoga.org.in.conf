# ==============================================================================
# Nginx Virtual Host Configuration for Telangana Yogasana Sports Portal
# Place in: /etc/nginx/sites-available/telanganayoga.org.in
# Symlink:  sudo ln -s /etc/nginx/sites-available/telanganayoga.org.in /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
# ==============================================================================

# 1. Upstream pool for Node.js / Express cluster managed by PM2
upstream nodejs_cluster {
    server 127.0.0.1:5000;
    keepalive 64;
}

# 2. HTTP Server - ACME Challenge & Permanent HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name telanganayoga.org.in www.telanganayoga.org.in;

    # Certbot / Let's Encrypt automated challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # Redirect all plain HTTP traffic to canonical HTTPS domain
    location / {
        return 301 https://telanganayoga.org.in$request_uri;
    }
}

# 3. HTTPS Server - TLS Termination & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name telanganayoga.org.in www.telanganayoga.org.in;

    # SSL Certificates (Automated by Certbot: sudo certbot --nginx)
    ssl_certificate /etc/letsencrypt/live/telanganayoga.org.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telanganayoga.org.in/privkey.pem;

    # TLS Protocols & Cipher Suites (Strict TLS 1.2 & 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (Enables faster TLS handshakes and privacy)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Canonical redirect: force www to apex domain
    if ($host = 'www.telanganayoga.org.in') {
        return 301 https://telanganayoga.org.in$request_uri;
    }

    # Root application directory on server
    root /var/www/yogasana-portal;

    # Maximum upload size for passport photos & birth certificates
    client_max_body_size 10M;

    # Gzip Compression at Nginx level
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Static Assets: Serve directly via Nginx with 30-day cache
    location /static/ {
        alias /var/www/yogasana-portal/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Meta files served directly
    location = /robots.txt {
        alias /var/www/yogasana-portal/public/robots.txt;
        add_header Content-Type text/plain;
        access_log off;
    }
    location = /sitemap.xml {
        alias /var/www/yogasana-portal/public/sitemap.xml;
        add_header Content-Type application/xml;
        access_log off;
    }
    location = /favicon.ico {
        alias /var/www/yogasana-portal/static/images/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Main Reverse Proxy to Express application
    location / {
        proxy_pass http://nodejs_cluster;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Essential headers for Express (trust proxy, client IP, HTTPS detection, originGuard)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Operational Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low-latency API and telemetry responses
        proxy_buffering off;
    }
}
